[build-system]
# Build-time only: flit_core is small and has no dependencies. Nothing
# here is needed at runtime.
requires = ["flit_core >=3.12,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "whatif-engine"
description = "Static, evidence-backed impact analysis for Python changes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
# Read by flit_core from whatif_engine.__version__, the single source.
dynamic = ["version"]
keywords = ["static analysis", "impact analysis", "dependency graph", "git"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
whatif = "whatif_engine.cli:main"

# The package lives in src/whatif_engine (src layout).
[tool.flit.module]
name = "whatif_engine"

[tool.flit.sdist]
include = ["tests/"]
